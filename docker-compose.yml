services:
  api:
    build: .
    container_name: pi-services-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: 1.1.0
      FRONTEND_URL: https://frontend-sample-model.vercel.app
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081
      SKIP_DB_CONNECT: "true"
    restart: unless-stopped
